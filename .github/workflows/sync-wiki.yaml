name: Sync Wiki to Reddit

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch brno-awesome README
        run: |
          curl -sL https://raw.githubusercontent.com/scherrer-txt/brno-awesome/main/README.md \
            -o /tmp/brno-awesome.md || echo "" > /tmp/brno-awesome.md

      - name: Build and send to Windmill
        env:
          WINDMILL_TOKEN: ${{ secrets.WINDMILL_TOKEN }}
          WINDMILL_URL: ${{ secrets.WINDMILL_URL }}
          # Passed as env, NEVER interpolated into the script body with ${{ }}:
          # a commit message containing shell metacharacters (parentheses,
          # backticks, $(...)) would otherwise break the run - or execute.
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          # Payload se skládá PŘES SOUBORY, ne přes proměnné a argumenty.
          # Důvod: 2026-09-03 sync spadl na `jq: Argument list too long`,
          # když do wiki přibylo 50kB shrnutí AMA. Obsah stránek i rostoucí
          # JSON šly do argv (`jq --arg v "$content"`, `echo "$FILES_JSON" |`,
          # `--argjson files "$FILES_JSON"`, `curl -d "$PAYLOAD"`) a narazilo
          # to na ARG_MAX. Nesynchronizovalo se pak NIC — ani stránky, které
          # se vešly. Proto `--rawfile`, `--slurpfile` a `--data-binary @soubor`.

          FILES=$(mktemp)
          TMP=$(mktemp)
          echo '{}' > "$FILES"

          pridej() {  # $1 = klíč stránky, $2 = cesta k souboru
            jq --arg k "$1" --rawfile v "$2" '. + {($k): $v}' "$FILES" > "$TMP"
            mv "$TMP" "$FILES"
          }

          # wiki/*.md a wiki/*.yaml -> stránka pojmenovaná podle souboru
          for file in wiki/*.md wiki/*.yaml; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            pridej "${name%.*}" "$file"
          done

          # wiki/config/* -> config/<jméno> na Redditu
          for file in wiki/config/*.yaml wiki/config/*.md; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            pridej "config/${name%.*}" "$file"
          done

          # wiki/ama/* -> ama/<jméno> na Redditu
          for file in wiki/ama/*.md; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            pridej "ama/${name%.*}" "$file"
          done

          # brno-awesome z cizího repa
          if [ -f "/tmp/brno-awesome.md" ]; then
            pridej "awesome" "/tmp/brno-awesome.md"
          fi

          echo "Files to sync:"
          jq 'keys' "$FILES"
          echo "Payload size: $(wc -c < "$FILES") B"

          PAYLOAD=$(mktemp)
          jq -n \
            --slurpfile files "$FILES" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg repo_url "$REPO_URL" \
            '{
              reddit_resource: "$res:u/kerray/reddit_ponocny_bot",
              files: $files[0],
              subreddit: "brno",
              commit_sha: $commit_sha,
              commit_message: $commit_message,
              repo_url: $repo_url
            }' > "$PAYLOAD"

          RESPONSE=$(mktemp)
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WINDMILL_TOKEN" \
            --data-binary @"$PAYLOAD" \
            "$WINDMILL_URL" > "$RESPONSE"

          echo "Windmill response:"
          jq . "$RESPONSE" || cat "$RESPONSE"

          ERRORS=$(jq -r '.errors // 0' "$RESPONSE")
          if [ "$ERRORS" != "0" ]; then
            echo "Stránky, které se nenasadily:"
            jq -r '.results[]? | select(.status == "error") | "  \(.page): \(.error)"' "$RESPONSE" || true
            echo "::error::Wiki sync had $ERRORS errors"
            exit 1
          fi
